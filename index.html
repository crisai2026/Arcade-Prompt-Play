<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcade crisai2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0a1a; --panel:#15132b; --panel2:#1d1a3a; --line:#2c2856;
    --text:#ecebff; --muted:#a19ecb; --pink:#ff4fb3; --cyan:#3ef0ff; --yellow:#ffd23e; --green:#59f2a0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Space Grotesk",system-ui,sans-serif;
    background-image:radial-gradient(circle at 20% -10%,#2a1660 0,transparent 45%),radial-gradient(circle at 110% 10%,#0e3a55 0,transparent 40%);
    min-height:100vh}
  .wrap{max-width:1180px;margin:0 auto;padding:32px 20px 60px}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
  h1{font-family:"Press Start 2P",monospace;font-size:clamp(18px,3.4vw,30px);line-height:1.35;margin:0;
    color:var(--yellow);text-shadow:3px 3px 0 var(--pink)}
  .sub{color:var(--muted);margin:10px 0 0;max-width:560px}
  .lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .lang button{background:none;border:0;color:var(--muted);padding:7px 14px;font:inherit;font-weight:700;cursor:pointer}
  .lang button.on{background:var(--cyan);color:#06122a}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 22px}
  .search{flex:1 1 240px;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 14px;font:inherit}
  .search:focus{outline:2px solid var(--cyan);border-color:transparent}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 13px;font:inherit;font-size:14px;cursor:pointer}
  .chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
  .count{color:var(--muted);font-size:14px;margin:-8px 0 16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px}
  .card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:18px;overflow:hidden;
    display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
  .card:hover{transform:translateY(-3px);border-color:var(--cyan)}
  .thumb{height:118px;display:flex;align-items:center;justify-content:center;font-size:54px;position:relative}
  .thumb .date{position:absolute;right:10px;bottom:8px;font-size:12px;color:#fff;background:#0007;padding:3px 8px;border-radius:999px}
  .thumb .new{position:absolute;left:10px;top:10px;font-family:"Press Start 2P",monospace;font-size:9px;background:var(--yellow);color:#1a1300;padding:5px 7px;border-radius:6px}
  .body{padding:16px 16px 14px;display:flex;flex-direction:column;gap:9px;flex:1}
  .title{font-weight:700;font-size:19px;margin:0}
  .desc{color:var(--muted);font-size:14.5px;line-height:1.45;margin:0;flex:1}
  .meta{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:12px;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:2px 7px}
  .by{font-size:13px;color:var(--green)}
  .actions{display:flex;gap:8px;margin-top:4px}
  .btn{flex:1;text-align:center;text-decoration:none;font-weight:700;border-radius:10px;padding:10px 8px;font-size:14px}
  .play{background:var(--cyan);color:#06122a}
  .play:hover{filter:brightness(1.1)}
  .play.off{background:#2b2850;color:var(--muted);pointer-events:none}
  .repo{border:1px solid var(--line);color:var(--text)}
  .repo:hover{border-color:var(--text)}
  .empty{color:var(--muted);text-align:center;padding:40px}
  footer{margin-top:42px;color:var(--muted);font-size:13px;text-align:center}
  footer a{color:var(--cyan)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="h-title">ARCADE<br>CRISAI2026</h1>
      <p class="sub" id="h-sub"></p>
    </div>
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button data-lang="es">ES</button><button data-lang="en">EN</button>
    </div>
  </header>

  <div class="bar">
    <input class="search" id="q" type="search" autocomplete="off">
    <div class="chips" id="chips"></div>
  </div>
  <p class="count" id="count"></p>
  <div class="grid" id="grid"></div>

  <footer id="foot"></footer>
</div>

<script>
/* =====================================================================
   CONFIG — para publicar un juego nuevo, copia un bloque {...} y edítalo.
   - repo:   nombre del repositorio en github.com/crisai2026
   - play:   link para jugar. "auto" = https://crisai2026.github.io/<repo>/
             (necesita GitHub Pages activado en Settings → Pages).
             Pon otro link si el juego vive en otro lado, o "" si no hay.
   - tags:   categorías (aparecen como filtros arriba)
   - by:     quién lo hizo (opcional)
   - hidden: true para ocultarlo sin borrarlo
   ===================================================================== */
const CONFIG = {
  githubUser: "crisai2026",
  newDays: 10,            // juegos actualizados hace menos de X días muestran "NEW"
  defaultLang: "en"
};

const GAMES = [
  { repo:"ultima-orbita", name:"Última Órbita", emoji:"🛰️", color:["#1b2a6b","#5a1f7a"], updated:"2026-11-19",
    tags:["3d","action"], play:"auto",
    es:"Mecha transformable en el espacio: cabina, tres modos de vuelo y misiones sobre cruceros destruidos.",
    en:"Transforming mecha in space: cockpit view, three flight modes and missions on wrecked cruisers." },
  { repo:"monster-sim-aotearoa", name:"Monster Sim: Aotearoa", emoji:"🦖", color:["#0f4d3a","#7a3a12"], updated:"2026-11-17",
    tags:["sim"], play:"auto",
    es:"Simulador de Defensa Civil: un kaiju ataca ciudades reales de Nueva Zelanda y tú diriges la respuesta.",
    en:"Civil Defence simulator: a kaiju attacks real New Zealand cities and you command the response." },
  { repo:"broken-wild", name:"Broken Wild", emoji:"⚙️", color:["#24452a","#4a3a7a"], updated:"2026-11-19",
    tags:["rpg","action"], play:"auto",
    es:"Prototipo de RPG roguelite de mundo abierto donde máquinas y naturaleza comparten un mundo con la física rota.",
    en:"Roguelite open-world RPG prototype where machines and nature share a world with broken physics." },
  { repo:"mission-tina-1", name:"Mission Tina-1", emoji:"👩‍🚀", color:["#0b2350","#1c6a8a"], updated:"2026-11-18",
    tags:["sim"], play:"auto",
    es:"Un día como astronauta en el navegador, inspirado en las misiones reales de Christina Koch.",
    en:"A one-day astronaut experience in the browser, inspired by Christina Koch's real missions." },
  { repo:"woodland-survival-craft", name:"Woodland Survival Craft", emoji:"🌲", color:["#1f4d22","#5b4a1c"], updated:"2026-11-06",
    tags:["calm","adventure"], play:"auto",
    es:"Supervivencia y construcción 2D vista desde arriba, estilo Minecraft. Diseño tranquilo.",
    en:"Top-down 2D survival crafting, Minecraft-style. Calm design." },
  { repo:"monster-sim-nz", name:"Monster Sim NZ (v1)", emoji:"🏙️", color:["#3a1a4d","#1f4d4d"], updated:"2026-11-06",
    tags:["sim"], play:"auto",
    es:"Primera versión: monstruos gigantes atacando ciudades de la Isla Sur.",
    en:"First version: giant monsters attacking South Island cities." },
  { repo:"escuadron-fenix", name:"Escuadrón Fénix", emoji:"🤖", color:["#5a1a1a","#2a2a6b"], updated:"2026-11-05",
    tags:["3d","action"], play:"auto",
    es:"Juego 3D de un mecha que se transforma de robot a caza (Three.js).",
    en:"3D game about a mecha that transforms from robot to fighter jet (Three.js)." },
  { repo:"rapid-unscheduled-lab", name:"Rapid Unscheduled Lab", emoji:"🚀", color:["#2a1a5a","#8a3a1a"], updated:"2026-11-05",
    tags:["sim"], play:"auto",
    es:"Laboratorio de cohetes: arma cohetes de varias etapas, lánzalos con física casi real y mira si llegan al espacio… o explotan.",
    en:"Rocket lab: build multi-stage rockets, launch them with real-ish physics and see if they reach space… or explode." },
  { repo:"knights-quest", name:"Knight's Quest", emoji:"🛡️", color:["#4d3a12","#1f2a5a"], updated:"2026-11-03",
    tags:["adventure"], play:"auto",
    es:"Videojuego de aventuras.",
    en:"Adventure video game." },
  { repo:"neon-tempo", name:"Neon Tempo", emoji:"🥁", color:["#5a0f4d","#0f3a6b"], updated:"2026-10-30",
    tags:["rhythm"], play:"auto",
    es:"Juego de ritmo con batería que mezcla los 80 y los 90.",
    en:"Drum rhythm game where the 80s meet the 90s." },
  { repo:"knight-quest-fairytale", name:"Knight Quest Fairytale", emoji:"🏰", color:["#3a1a5a","#5a3a1a"], updated:"2026-10-13",
    tags:["platform"], play:"auto",
    es:"Plataformas estilo Mario con algunas sorpresas.",
    en:"Mario-style platformer with a few twists." },
  { repo:"forest-pokemon-battle", name:"Forest Pokémon Battle", emoji:"🍃", color:["#1a4d2a","#4d5a1a"], updated:"2026-10-05",
    tags:["strategy","2p"], play:"auto",
    es:"Juego de estrategia para dos jugadores en el bosque.",
    en:"Two-player strategy game in the forest." },
  { repo:"dragon-storm", name:"Dragon Storm", emoji:"🐉", color:["#5a1a2a","#1a3a6b"], updated:"2026-09-30",
    tags:["platform","action"], play:"auto",
    es:"Plataformas estilo anime: un héroe absorbe tormentas y terremotos para salvar el universo.",
    en:"Anime-style platformer: a hero absorbs storms and earthquakes to save the universe." },
  { repo:"green-grow", name:"Green Grow", emoji:"🌱", color:["#1f5a2a","#3a5a1a"], updated:"2026-09-26",
    tags:["calm"], play:"auto",
    es:"Granja tranquila en el bosque: cultiva plantas y cría animales.",
    en:"A calm farming game in the forest: grow plants and raise animals." },
  { repo:"retro-surf-dash", name:"Retro Surf Dash", emoji:"🏄", color:["#0f4d6b","#6b4d0f"], updated:"2026-09-24",
    tags:["action"], play:"auto",
    es:"Arcade retro de surf.",
    en:"Retro surf arcade." },
];

const TAGS = {
  all:{es:"Todos",en:"All"}, "3d":{es:"3D",en:"3D"}, action:{es:"Acción",en:"Action"}, sim:{es:"Simulación",en:"Simulation"},
  adventure:{es:"Aventura",en:"Adventure"}, platform:{es:"Plataformas",en:"Platformer"}, rpg:{es:"RPG",en:"RPG"},
  calm:{es:"Tranquilo",en:"Calm"}, strategy:{es:"Estrategia",en:"Strategy"}, rhythm:{es:"Ritmo",en:"Rhythm"}, "2p":{es:"2 jugadores",en:"2 players"}
};

const T = {
  es:{ sub:"Juegos de navegador hechos en casa con Claude. Toca ▶ para jugar o mira el código en GitHub.",
       search:"Buscar juego…", play:"▶ Jugar", off:"Sin link aún", repo:"</> Repo", by:"Hecho por",
       count:n=>`${n} juego${n===1?"":"s"}`, empty:"No hay juegos con ese filtro.",
       foot:u=>`Todo el código en <a href="https://github.com/${u}">github.com/${u}</a>`, upd:"act." },
  en:{ sub:"Home-made browser games built with Claude. Tap ▶ to play or check the code on GitHub.",
       search:"Search games…", play:"▶ Play", off:"No link yet", repo:"</> Repo", by:"Made by",
       count:n=>`${n} game${n===1?"":"s"}`, empty:"No games match that filter.",
       foot:u=>`All the code at <a href="https://github.com/${u}">github.com/${u}</a>`, upd:"upd." }
};

/* ===================== (no hace falta tocar lo de abajo) ===================== */
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
let lang = store.get("arcade-lang") || CONFIG.defaultLang;
let tag = "all", query = "";
const playUrl = g => g.play === "auto" ? `https://${CONFIG.githubUser}.github.io/${g.repo}/` : (g.play || "");
const repoUrl = g => `https://github.com/${CONFIG.githubUser}/${g.repo}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isNew = d => (Date.now() - new Date(d)) / 864e5 < CONFIG.newDays;
const fmtDate = d => new Date(d+"T12:00:00").toLocaleDateString(lang==="es"?"es-CL":"en-NZ",{day:"numeric",month:"short",year:"numeric"});
const visible = () => GAMES.filter(g => !g.hidden).sort((a,b) => b.updated.localeCompare(a.updated));

function renderChips(){
  const used = new Set(visible().flatMap(g => g.tags));
  const keys = ["all", ...Object.keys(TAGS).filter(k => used.has(k))];
  document.getElementById("chips").innerHTML = keys.map(k =>
    `<button class="chip ${k===tag?"on":""}" data-tag="${k}">${esc((TAGS[k]||{})[lang]||k)}</button>`).join("");
}

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.getElementById("h-sub").textContent = t.sub;
  document.getElementById("q").placeholder = t.search;
  document.getElementById("foot").innerHTML = t.foot(CONFIG.githubUser);
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.lang===lang));
  renderChips();
  const q = query.toLowerCase();
  const list = visible().filter(g => (tag==="all" || g.tags.includes(tag)) &&
    (!q || [g.name,g.es,g.en,g.repo,g.by||""].join(" ").toLowerCase().includes(q)));
  document.getElementById("count").textContent = t.count(list.length);
  document.getElementById("grid").innerHTML = list.length ? list.map(g => {
    const p = playUrl(g);
    return `<article class="card" data-repo="${esc(g.repo)}">
      <div class="thumb" style="background:linear-gradient(135deg,${g.color[0]},${g.color[1]})">
        ${isNew(g.updated)?'<span class="new">NEW</span>':""}
        <span aria-hidden="true">${g.emoji}</span>
        <span class="date">${t.upd} ${fmtDate(g.updated)}</span>
      </div>
      <div class="body">
        <h2 class="title">${esc(g.name)}</h2>
        <p class="desc">${esc(g[lang]||g.es)}</p>
        ${g.by?`<div class="by">★ ${t.by} ${esc(g.by)}</div>`:""}
        <div class="meta">${g.tags.map(k=>`<span class="tag">${esc((TAGS[k]||{})[lang]||k)}</span>`).join("")}</div>
        <div class="actions">
          ${p?`<a class="btn play" href="${esc(p)}" target="_blank" rel="noopener">${t.play}</a>`:`<span class="btn play off">${t.off}</span>`}
          <a class="btn repo" href="${repoUrl(g)}" target="_blank" rel="noopener">${esc(t.repo)}</a>
        </div>
      </div></article>`;
  }).join("") : `<p class="empty">${t.empty}</p>`;
  checkPages();
}

/* Cuando el portal vive en crisai2026.github.io, revisa qué juegos tienen Pages
   activado y apaga el botón ▶ de los que todavía no. En otros sitios no hace nada. */
const pagesStatus = {};
function checkPages(){
  if (location.hostname !== `${CONFIG.githubUser}.github.io`) return;
  visible().filter(g => g.play === "auto").forEach(g => {
    const apply = ok => { const a = document.querySelector(`.card[data-repo="${g.repo}"] .play`);
      if (a && !ok){ a.classList.add("off"); a.textContent = T[lang].off; a.removeAttribute("href"); } };
    if (g.repo in pagesStatus) return apply(pagesStatus[g.repo]);
    fetch(`/${g.repo}/`, {method:"HEAD"}).then(r => r.ok).catch(() => true)
      .then(ok => { pagesStatus[g.repo] = ok; apply(ok); });
  });
}

document.querySelector(".lang").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  lang = b.dataset.lang; store.set("arcade-lang", lang); render();
});
document.getElementById("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return; tag = b.dataset.tag; render();
});
document.getElementById("q").addEventListener("input", e => { query = e.target.value; render(); });
render();
</script>
</body>
</html>
